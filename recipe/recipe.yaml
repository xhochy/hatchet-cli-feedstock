context:
  version: "0.89.0"

package:
  name: hatchet-cli
  version: ${{ version }}

source:
  - url: https://github.com/hatchet-dev/hatchet/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 2fd47e6271934e71c8cf75387f4cefe8d3fff8ecc49d7aab52562d931aa9f0c6
    target_directory: src

build:
  number: 1
  script:
    - cd src/cmd/hatchet-cli
    - go-licenses save . --save_path ../../../library_licenses --ignore github.com/mattn/go-localereader
    - if: win
      then: |
        for /f "delims=" %%i in ('dir /s /b %SRC_DIR%\gopath\pkg\mod\github.com\mattn\go-localereader*@v*\LICENSE') do (
          mkdir %SRC_DIR%\library_licenses\github.com\mattn\go-localereader
          copy "%%i" %SRC_DIR%\library_licenses\github.com\mattn\go-localereader\LICENSE
        )
    - if: unix
      then: go build -v -o $PREFIX/bin/hatchet -ldflags="-s -w"
      else: go build -v -o %LIBRARY_BIN%\hatchet.exe -ldflags="-s"

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - hatchet --version
      - hatchet --help
  - package_contents:
      bin:
        - hatchet
      strict: true

about:
  homepage: https://hatchet.run
  summary: CLI for the Hatchet workflow orchestration engine
  description: |
    Hatchet is an orchestration engine for background tasks, AI agents, and
    durable workflows. This package provides the hatchet CLI for interacting
    with Hatchet.
  license: MIT
  license_file:
    - src/LICENSE
    - library_licenses/
  documentation: https://docs.hatchet.run/cli
  repository: https://github.com/hatchet-dev/hatchet

extra:
  recipe-maintainers:
    - xhochy
